name: PR approval policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
    branches: [no_sign_up]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [no_sign_up]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to reassess
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always execute trusted base code. Never checkout/run a PR's code with write permissions.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/no_sign_up
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/github-script@v7
        with:
          script: |
            if (!require('fs').existsSync('./.github/scripts/pr-approval-policy.cjs')) {
              core.notice('Bootstrap: trusted base policy is not installed. No approval check is granted.');
              return;
            }
            const { run } = require('./.github/scripts/pr-approval-policy.cjs');
            await run({ github, context, core });
