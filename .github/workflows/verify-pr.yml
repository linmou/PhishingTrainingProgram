name: Verify PR (no hosted state)

on:
  pull_request:
    branches: [no_sign_up]
  push:
    branches: [no_sign_up]
  merge_group:

permissions:
  contents: read

jobs:
  isolation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify same-host fixture locks and per-run export paths
        run: |
          node --test tutor-system/scripts/browser-e2e/fixture-lock.test.js
          node --test scripts/database/export_validation_baseline.test.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tutor-system/package-lock.json
      - run: npm ci
      - name: Deterministic Jest regression
        run: CI=true npm run test:regression -- --runInBand
      - name: Build React application
        run: npm run build
