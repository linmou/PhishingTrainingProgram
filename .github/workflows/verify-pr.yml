name: Verify PR isolation (no hosted state)

on:
  pull_request:
    branches: [no_sign_up]
  push:
    branches: [no_sign_up]
  merge_group:

permissions:
  contents: read

# Uses only built-in Node.js / POSIX test tools: no secrets, Docker, or Supabase.
# The main React/Jest job will be restored after the pre-existing npm lockfile
# mismatch is repaired: https://github.com/linmou/PhishingTrainingProgram/issues/5
jobs:
  isolation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify cross-worktree lock and run-scoped export isolation
        run: |
          node --test tutor-system/scripts/browser-e2e/fixture-lock.test.js
          node --test scripts/database/export_validation_baseline.test.js
