name: Verify PR (no hosted state)

on:
  pull_request:
  push:
    branches: [no_sign_up]
  merge_group:

permissions:
  contents: read

jobs:
  isolation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cross-worktree lock and run-scoped export isolation
        run: |
          node --test tutor-system/scripts/browser-e2e/fixture-lock.test.js
          node --test scripts/database/export_validation_baseline.test.js
          node --test scripts/database/disposable-database.test.js
          node --test scripts/staging-coordination.test.js

      # Prevent the human-facing PR handoff from drifting away from CI check IDs.
      # Structural check only: PR results and review decisions are external gates.
      - name: Check PR template against CI job IDs
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const template = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/verify-pr.yml', 'utf8');
          const split = workflow.split(/^jobs:\s*$/m);
          assert.equal(split.length, 2, 'Expected one GitHub Actions jobs section');
          const jobs = [...split[1].matchAll(/^  ([a-z][a-z0-9-]*):\s*$/gm)].map(match => match[1]);
          assert.ok(jobs.length > 0, 'No CI jobs found');

          for (const job of jobs) {
            assert.ok(template.includes('`' + job + '`'), 'PR template missing CI job: ' + job);
          }
          for (const heading of ['## Summary', '## Verification', '## Release handoff']) {
            assert.ok(template.includes(heading), 'PR template missing section: ' + heading);
          }
          NODE

  frontend-jest:
    runs-on: ubuntu-latest
    env:
      REACT_APP_SUPABASE_URL: http://127.0.0.1:54321
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder
    defaults:
      run:
        working-directory: tutor-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tutor-system/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - name: Deterministic Jest regression
        run: npm run test:regression -- --runInBand

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tutor-system/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - name: Build React application
        run: CI=false npm run build
