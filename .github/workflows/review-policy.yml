name: Review Policy (trusted base)
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [no_sign_up]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (empty refreshes all)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  review-policy-evaluation:
    runs-on: ubuntu-latest
    steps:
      # Never run PR-submitted code with these privileged permissions.
      - uses: actions/checkout@v4
        with:
          ref: no_sign_up
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const policy = require('./.github/scripts/review-policy.cjs');
            await policy.run({github, context, core});
