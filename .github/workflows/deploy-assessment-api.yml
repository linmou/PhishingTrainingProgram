name: Deploy Assessment API

on:
  workflow_dispatch:
    inputs:
      apply_runtime_migration:
        description: Apply the pending staging assessment runtime migration
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to PhishingTutorStaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-system
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REACT_APP_OAI_API_KEY: ${{ secrets.REACT_APP_OAI_API_KEY }}
      REACT_APP_OAI_BASE_URL: ${{ secrets.REACT_APP_OAI_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$REACT_APP_OAI_API_KEY"
          test -n "$REACT_APP_OAI_BASE_URL"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Apply staging assessment runtime migration
        if: inputs.apply_runtime_migration
        shell: bash
        run: supabase db query --linked --project-ref ciubrzggdqesgvfkpolj --file supabase/migrations/20260929090000_staging_assessment_runtime.sql

      - name: Configure Edge Function provider secrets
        shell: bash
        env:
          PROJECT_REF: ciubrzggdqesgvfkpolj
        run: |
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'REACT_APP_OAI_API_KEY=%s\n' "$REACT_APP_OAI_API_KEY"
            printf 'REACT_APP_OAI_BASE_URL=%s\n' "$REACT_APP_OAI_BASE_URL"
            printf 'OAI_MODEL=qwen3.5-flash\n'
          } > "$secrets_file"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$secrets_file"

      - name: Deploy assessment-api without Supabase Auth JWT verification
        shell: bash
        env:
          PROJECT_REF: ciubrzggdqesgvfkpolj
        run: supabase functions deploy assessment-api --project-ref "$PROJECT_REF" --no-verify-jwt
