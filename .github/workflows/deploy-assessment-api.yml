name: Deploy Assessment API

on:
  workflow_dispatch:
    inputs:
      seed_assessment_room:
        description: Seed the dedicated staging browser room
        type: boolean
        default: false
      inspect_assessment_state:
        description: Print provider validation for the staging browser room
        type: boolean
        default: false

# Serialize jobs deploying to the shared staging project in this workflow.
# Not FIFO, and does not cover local/other-workflow API deployments.
concurrency:
  group: supabase-staging-ciubrzggdqesgvfkpolj
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-staging:
    name: Deploy to PhishingTutorStaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-system
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OAI_API_KEY: ${{ secrets.OAI_API_KEY }}
      OAI_BASE_URL: ${{ secrets.OAI_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Acquire cross-machine staging lease
        run: node ../scripts/staging-coordination.js acquire ../output/staging-release

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$OAI_API_KEY"
          test -n "$OAI_BASE_URL"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Seed staging assessment browser room
        if: inputs.seed_assessment_room
        shell: bash
        run: supabase db query --linked --project-ref ciubrzggdqesgvfkpolj --file supabase/fixtures/staging_assessment_ai_only_20260929.sql

      - name: Inspect staging provider attempts
        if: inputs.inspect_assessment_state
        shell: bash
        run: supabase db query --linked --project-ref ciubrzggdqesgvfkpolj --file supabase/tests/staging_assessment_provider_inspect.sql

      - name: Configure Edge Function provider secrets
        shell: bash
        env:
          PROJECT_REF: ciubrzggdqesgvfkpolj
        run: |
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'OAI_API_KEY=%s\n' "$OAI_API_KEY"
            printf 'OAI_BASE_URL=%s\n' "$OAI_BASE_URL"
            printf 'TRANSFER_ASSESSMENT_ENABLED=true\n'
          } > "$secrets_file"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$secrets_file"

      - name: Deploy assessment-api without Supabase Auth JWT verification
        shell: bash
        env:
          PROJECT_REF: ciubrzggdqesgvfkpolj
        run: supabase functions deploy assessment-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Deploy ai-api for localStorage/offline sessions
        shell: bash
        env:
          PROJECT_REF: ciubrzggdqesgvfkpolj
        run: supabase functions deploy ai-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      # Keep the lease across deployment and the release owner's acceptance checks.
      # Download this artifact, verify the same commit under the lease, then release.
      - name: Retain lease and exact candidate evidence for acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.sha }}-${{ github.run_id }}
          path: output/staging-release/
