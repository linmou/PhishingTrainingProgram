# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Account Security Alert prompt-behavior evaluation for phishing tutor prompts

prompts:
  - file://prompts/current.chat.prompt.json
  - file://prompts/improved.chat.prompt.json

providers:
  - id: openai:chat:gpt-4o-mini
    label: target-gpt-4o-mini
    config:
      temperature: 0.2
      max_tokens: 220

defaultTest:
  options:
    provider:
      id: openai:chat:gpt-4o
      config:
        temperature: 0

tests: file://cases/account-security-alert.yaml
