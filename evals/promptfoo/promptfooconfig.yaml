# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Qwen3.5 Flash ecological and synthetic-holdout tutor evaluation

prompts:
  - file://prompts/current.chat.prompt.json

providers:
  - id: openai:chat:qwen3.5-flash
    label: target-qwen3.5-flash
    config:
      temperature: 0.3
      max_tokens: 100
      passthrough:
        enable_thinking: false

defaultTest:
  options:
    provider:
      id: openai:chat:qwen3.5-flash
      config:
        temperature: 0
        max_tokens: 100
        passthrough:
          enable_thinking: false

tests:
  # Primary: webpage demo templates + classic room shapes
  - file://cases/webpage-ecological.yaml
  # Synthetic transfer/holdout variations (not product-identical cases)
  - file://cases/account-security-alert.yaml
