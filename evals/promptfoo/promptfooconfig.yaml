# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Ecological webpage-shaped prompt-behavior evaluation (same room data + call shape as product AI button)

prompts:
  - file://prompts/current.chat.prompt.json
  - file://prompts/improved.chat.prompt.json

providers:
  - id: openai:chat:gpt-4o-mini
    label: target-gpt-4o-mini
    config:
      # Align with product short tutor replies
      temperature: 0.3
      max_tokens: 100

defaultTest:
  options:
    provider:
      # Same gateway-available model as the target (gpt-4o is often 503 here)
      id: openai:chat:gpt-4o-mini
      config:
        temperature: 0

tests:
  # Primary: webpage demo templates + classic room shapes
  - file://cases/webpage-ecological.yaml
  # Holdout variations from original account-security suite
  - file://cases/account-security-alert.yaml
